# Exe Windows et AppImage Linux de l'éditeur.
# - Pull request / lancement manuel : tests, puis exe et AppImage joints au run
#   (artefacts).
# - Tag vX.Y.Z : même chose, puis release GitHub avec le zip de l'exe,
#   l'AppImage et les notes de docs/notes-de-version/vX.Y.Z.md.
name: Exe Windows, AppImage Linux et release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # création de la release

jobs:
  exe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen    # tests de l'interface sans écran
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: python -m pip install PySide6 pyinstaller

      - name: Version du tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import dqmj2p_save; print(dqmj2p_save.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, mais le code est en version $version"
            exit 1
          fi
          test -f "docs/notes-de-version/$GITHUB_REF_NAME.md"

      - name: Tests
        run: python -m unittest discover tests

      - name: Exe
        run: python outils/construire_exe.py

      - name: Zip
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then nom=$GITHUB_REF_NAME; else nom=test; fi
          echo "ZIP=$(python outils/preparer_zip.py "$nom")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Editeur-DQMJ2P-windows
          path: ${{ env.ZIP }}

  appimage:
    # La plus ancienne Ubuntu disponible : l'AppImage ne tourne que sur des
    # systèmes dont la glibc est au moins aussi récente que celle du build.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      APPIMAGE_EXTRACT_AND_RUN: '1'   # pas de FUSE sur le runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bibliothèques dont le module xcb de Qt a besoin : PyInstaller les
      # embarque, car elles manquent sur une partie des distributions.
      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Dépendances
        run: python -m pip install PySide6 pyinstaller

      - name: Tests
        run: python -m unittest discover tests

      - name: appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: AppImage
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then nom=$GITHUB_REF_NAME; else nom=test; fi
          appimage=$(python outils/construire_appimage.py "$nom" ./appimagetool | tail -n 1)
          echo "APPIMAGE_NOM=$appimage" >> "$GITHUB_ENV"

      # L'éditeur doit démarrer et tenir 15 s sans planter : timeout le coupe
      # alors (code 124). Un autre code est un plantage au démarrage.
      - name: Démarrage
        run: |
          chmod +x "dist/$APPIMAGE_NOM"
          code=0
          timeout 15 "dist/$APPIMAGE_NOM" || code=$?
          if [ "$code" != 124 ]; then
            echo "::error::l'AppImage s'est arrêtée au démarrage (code $code)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Editeur-DQMJ2P-linux
          path: dist/${{ env.APPIMAGE_NOM }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [exe, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: docs/notes-de-version/${{ github.ref_name }}.md
          files: release/*
